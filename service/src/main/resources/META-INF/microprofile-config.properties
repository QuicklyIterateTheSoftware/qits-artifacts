# Service-layer config defaults, shipped from this library jar (ordinal 100; the consuming app's
# application.properties at 250 overrides them). Carried over verbatim from the monorepo's
# service/src/main/resources/application.properties, minus everything that belonged to another
# context.

# Where the git host finds the bare origins it serves: <data-dir>/<repoId>/origin, the same layout
# the repositories context clones into. GitHostRoutes also carries a relative code default
# ("data/repositories"); this pins the CWD-independent home-dir location the deployment uses.
qits.repositories.data-dir=${user.home}/.qits/data/repositories

# Where the git host's post-receive hook delivers CI events (docs/epics/qits-ci/). The event is an
# HTTP POST and always was, which is exactly why the artifacts->ci seam survived the monolith split
# unchanged — only this url moves when ci becomes its own deployable
# (http://qits-ci:<port>/..., same payload). CiPostReceiveNotifier has no code default, so a
# consuming app that does not override this must still have SOMETHING resolvable here.
qits.ci.intake-url=http://localhost:${quarkus.http.port:8080}/api/ci/events/post-receive
# The same static secret ci's intake filter checks. Blank (the default) sends no header, matching
# that filter's open mode.
qits.ci.token=

# Artifacts uploads (streamed to disk in BlobService, per-type cap enforced while streaming) need a
# wire-body limit at least as large as the biggest type cap. Quarkus' max-body-size is a HARD GLOBAL
# ceiling — it gates every route, a custom Vert.x route does NOT bypass it — so it must be sized to
# the largest upload. 64M = the ci-videos cap. NOTE for the consuming app: this raises the ceiling
# for ITS routes too, which is the tradeoff the monorepo tracks in
# docs/issues/2026-07-19_artifacts-global-max-body-size-widens-public-ingest-dos.md.
quarkus.http.limits.max-body-size=64M
