# Service-layer config defaults, shipped from this library jar (ordinal 100; the consuming app's
# application.properties at 250 overrides them). Carried over verbatim from the monorepo's
# service/src/main/resources/application.properties, minus everything that belonged to another
# context.

# Where the git host's post-receive hook delivers CI events (docs/epics/qits-ci/). The event is an
# HTTP POST and always was, which is exactly why the artifacts->ci seam survived the monolith split
# unchanged — only this url moves when ci becomes its own deployable
# (http://qits-ci:<port>/..., same payload). PostReceiveNotifier has no code default, so a
# consuming app that does not override this must still have SOMETHING resolvable here.
#
# The PATH is qits-ci's, not ours: it serves its own gateway segment, so the intake is
# /ci/api/events/post-receive. Only the host part is a deployment decision.
qits.ci.intake-url=http://localhost:${quarkus.http.port:8080}/ci/api/events/post-receive
# The same static secret ci's intake filter checks. Blank (the default) sends no header, matching
# that filter's open mode.
qits.ci.token=

# Where the SAME post-receive event goes a second time: qits-projects answers it by pushing the
# repository to its GitHub sync target, so a push that reaches this host is backed up without anyone
# scheduling it. Declared exactly like the ci url above — no code default, the path is qits-projects'
# own gateway segment, and only the host part is a deployment decision
# (http://qits-projects:<port>/...).
#
# It is a SEPARATE key rather than a list because the two consumers differ in more than address: the
# ci event carries a credential and can be suppressed per push with `-o qits.no-ci`, this one
# carries neither and fires for every push (a backup is owed even for a push CI ignores).
qits.projects.intake-url=http://localhost:${quarkus.http.port:8080}/projects/api/events/post-receive

# --- the wire body ceiling, and the numbers that must move together ------------------------------
# quarkus.http.limits.max-body-size is a global ceiling, but NOT the single hard gate this comment
# used to claim. Quarkus enforces it in exactly two places (verified against 3.34.6, and pinned by
# BodyCeilingProbeTest):
#
#   1. HttpServerCommonHandlers.enforceMaxBodySize installs a route at order -2 on the SAME router
#      GitHostRoutes and RegistryRoutes register on. It rejects a declared Content-Length over the
#      limit with a bare 413 + Connection: close, before any application handler runs. Nothing
#      bypasses this, custom Vert.x route or not.
#   2. For a CHUNKED body there is no Content-Length to compare, so that handler only stashes the
#      limit in the RoutingContext under "io.quarkus.max-request-size" and calls next(). The limit
#      is then applied by whatever reads the body: RESTEasy's VertxInputStream on /artifacts/api,
#      and io.quarkus.vertx.http.runtime.VertxInputStream on /v2 (see registry/OciRequestBody).
#      A raw route that reads HttpServerRequest itself is NOT gated at all — which is why the
#      registry never reads the body directly, and why the git host sets an explicit BodyHandler
#      limit below.
#
# Sized ABOVE qits.artifacts.oci.max-layer-size on purpose. Were the two equal the wire 413 would
# always win — VertxInputStream compares bytesRead(), which runs ahead of what BlobStore has
# consumed — and the client would get an empty-bodied 413 with the connection reset instead of the
# OCI error envelope that explains itself. The slack is one ci-videos' worth:
#
#   1088M = 1 GiB (the OCI layer cap) + 64M slack
#     64M = the ci-videos type cap, unchanged
#     25M = the ci-screenshots type cap, unchanged
#
# It must never drop below 64M or ci-videos breaks silently. Config expressions cannot express a
# max(), so this is a literal that both consumers are named in.
#
# NOTE for the consuming deployment: this raises the ceiling for every route in this process. The
# tradeoff, and what an operator can actually do about it, is recorded in
# docs/issues/2026-07-19_artifacts-global-max-body-size-widens-public-ingest-dos.md in THIS repo.
quarkus.http.limits.max-body-size=1088M

# --- the OCI Distribution registry (see eu.wohlben.qits.registry) ---------------------------------
# The per-layer cap for OCI_IMAGES, enforced by BlobStore while streaming exactly as the per-type
# caps are. A config knob rather than a RepositoryType field because RepositoryType.maxBytes() is a
# compile-time constant and a deployment's disk budget is not — see that enum's OCI_IMAGES javadoc.
# Must stay below quarkus.http.limits.max-body-size (see above).
qits.artifacts.oci.max-layer-size=1G

# Manifests are buffered whole — they have to be digested and parsed as a unit — so this is the one
# place a BodyHandler is the right tool on /v2. 4M is ~1000x a real manifest.
qits.artifacts.oci.max-manifest-size=4M

# How long an upload session survives without being touched. Sessions are in-memory (each carries a
# running MessageDigest, which cannot be persisted), swept when the next one opens, and lost on
# restart — which is the Distribution spec's own contract: a session id is opaque and may expire.
qits.artifacts.oci.upload-session-ttl=PT30M

# How long a blob upload waits for the NEXT chunk before the connection is dropped. NOT a budget for
# the whole upload, which may legitimately run for an hour: a stalled client is released in a
# minute, a slow but progressing one is never interrupted.
qits.artifacts.oci.upload-idle-timeout=PT1M

# --- the OCI pull-through mirror (see eu.wohlben.qits.registry.MirrorUpstream) --------------------
# WHICH upstreams are mirrored is deliberately NOT here: it is rows in oci_mirror_upstream, with a
# CRUD API and a page in the explorer (proxy-pulling-normal-images.md, decision 1 — config keys are
# invisible, a table is not). What is left below is behaviour, which is the same for all of them.
#
# How long a cached tag is served without asking upstream. A tag is the ONE mirrored thing that
# mutates — jdk-25 and 9.6 move under toolchain and security updates — while manifests-by-digest and
# blobs are immutable and cached forever. On expiry the mirror REVALIDATES with a HEAD rather than
# refetching: a registry HEAD returns Docker-Content-Digest, and Docker Hub does not count one
# against its anonymous pull limit, so an unchanged tag costs nothing and an hour is affordable.
# When upstream is unreachable the stale copy is served anyway, which is what keeps builds building
# through an outage.
qits.artifacts.oci.mirror.tag-ttl=PT1H

# The two bounds on an upstream wait. This is the platform's first hard runtime dependency on the
# public internet INSIDE a request, and after the FROM rewrite it sits under every service build, so
# a hung upstream must never pin a worker thread: every request carries one of these, and there are
# no retries. Sized by what is being fetched, exactly as the npm proxy sizes its two (30 s for a
# document, 10 minutes for a payload) — a manifest is small JSON and a layer can be a gigabyte over
# a slow link. The connect timeout is 10 s and is not a knob; it bounds a black-holed host, which no
# deployment has a different opinion about.
qits.artifacts.oci.mirror.manifest-timeout=PT30S
qits.artifacts.oci.mirror.blob-timeout=PT10M

# WHERE an upstream is dialled, overriding the derivation from its domain (https://<domain>, with
# docker.io -> registry-1.docker.io as the one well-known exception). Blank in every deployment, and
# a single global value rather than a per-upstream one because it exists for exactly one job: this
# repo's suite points it at an in-process stub registry, which is what lets the miss path — the
# fetch, the digest verification, the token dance, the revalidation, the serve-stale — be proved by
# `mvn verify` with no network and no second code path. The suite's own default is a CLOSED PORT
# (see src/test/resources/application.properties), so a test that has not opted into the stub cannot
# reach the internet even by accident.
#
# It is BLANK here, and blank is why MirrorUpstream injects it as Optional<String>: SmallRye reads a
# configured-empty value as ABSENT, so a String injection — with or without defaultValue="" — fails
# the boot of the packaged binary while every test, which sets a real value, stays green.
qits.artifacts.oci.mirror.endpoint-override=

# --- the npm registry (see eu.wohlben.qits.npm) ---------------------------------------------------
# The largest npm tarball this service will take in, in either direction.
#
# On the PUBLISH path it is a stated BodyHandler limit, and stating it is not optional:
# BodyHandler.create() defaults to 10 MiB (vertx-web's own default — the bug qits.repositories.git.
# max-pack-size exists for), and an npm publish document carries the tarball base64-INFLATED by 4/3
# inside JSON, so the effective tarball ceiling here is about 24M. Deliberately far below
# quarkus.http.limits.max-body-size so the application's 413 wins the race and the client gets a
# message rather than an empty body and a reset connection — the same relationship
# qits.artifacts.oci.max-layer-size has with that ceiling.
#
# On the PROXY path the same number caps a tarball streamed in from upstream (through BlobStore, so
# nothing is buffered). One knob rather than two because it answers one question — how big an npm
# tarball this deployment is willing to hold — and a deployment that pulls large prebuilt binaries
# (the @next/swc-* shape of package) raises it here for both paths at once.
qits.artifacts.npm.max-publish-size=32M

# What an NPM_PROXY repository is a cache OF. No credential: npmjs has no anonymous pull limit of
# the Docker-Hub kind, so the key exists for the day one is needed or a different upstream is, not
# because anything today reads more than the default.
qits.artifacts.npm.proxy.upstream=https://registry.npmjs.org

# How long a cached packument is served without asking upstream. Packuments are the one npm document
# that genuinely mutates — a new version appears with nothing here changing — so unlike a tarball
# they cannot be cached forever. On expiry the proxy REVALIDATES with If-None-Match rather than
# refetching, so a short TTL costs a 304 rather than a document; and when upstream is unreachable
# the stale copy is served anyway, which is what keeps CI installing through an npmjs outage.
qits.artifacts.npm.proxy.packument-ttl=PT5M

# --- the maven pull-through cache (see eu.wohlben.qits.maven.MavenUpstream) -----------------------
# What a MAVEN_PROXY repository is a cache OF. No credential: Central serves anonymously and has no
# pull limit of the Docker-Hub kind, so the key exists for the day a deployment wants a different
# upstream — a corporate mirror, a regional CDN — not because anything today reads more than the
# default.
qits.artifacts.maven.proxy.upstream=https://repo1.maven.org/maven2
#
# How long a cached maven-metadata.xml is served without asking upstream. It is the one maven
# document that mutates — it lists the versions upstream has, so a release changes it with nothing
# here changing — while every artifact path is immutable and cached forever. On expiry the proxy
# REVALIDATES with If-None-Match (or If-Modified-Since, for an upstream too old to answer an etag)
# rather than refetching, so an hour costs a 304 rather than a document; and when upstream is
# unreachable the stale copy is served anyway, which is what keeps a build resolving through a
# Central outage.
#
# An hour rather than npm's five minutes because of what waits on it: npm resolves a range on every
# install, so a package published minutes ago is expected to appear, while a maven build pins exact
# versions and reads this document only to resolve a RANGE or a LATEST — neither of which the
# platform's own builds use. A release nobody can see for an hour costs nothing; a document refetched
# per resolve costs every build.
qits.artifacts.maven.proxy.metadata-ttl=PT1H
#
# The two bounds on an upstream wait are NOT keys: 30 s for a document and 10 minutes for an
# artifact, the npm proxy's own numbers, as constants in MavenUpstream. There are no retries. This
# sits inside a request on a worker thread, so what matters is that a hung upstream costs one
# bounded wait — a number no deployment has a different opinion about.
#
# The size cap is qits.artifacts.maven.max-artifact-size (default 128M, declared on MavenRoutes and
# MavenUpstream rather than here, as it always was): ONE knob for both directions, npm's
# max-publish-size precedent, because it answers one question — how large a maven file this
# deployment is willing to hold, whether it arrived from a deploy or from upstream.

# --- the git host's pack limit -------------------------------------------------------------------
# GitHostRoutes buffers the pack into memory through a BodyHandler, so unlike the registry it must
# NOT inherit the ceiling above — a 1 GB pack would be a 1 GB heap allocation. It needs its own,
# lower number.
#
# It also cannot be left implicit. BodyHandler.create() is not unlimited: vertx-web's
# BodyHandlerImpl defaults bodyLimit to 10 MiB, so before this property existed every push over
# 10 MB was silently 413'd — well under the 64M this file's previous comment claimed applied, and
# the README said so too. 64M keeps the documented behaviour and now actually delivers it.
qits.repositories.git.max-pack-size=64M

# --- the default branch's seatbelt (see githost/ProtectedRefHook) ---------------------------------
# Whether a direct update or delete of a repository's default branch (its bare HEAD, i.e.
# refs/heads/main here) is refused. Creates are always allowed — an empty repo has no default branch
# to protect, and blocking the seeding push buys no safety.
#
# FALSE in the shipped defaults, and that is not timidity: this service is the git host that serves
# its own redeploy, so a protection bug that landed enabled could reject the very push that fixes
# it. The rollout is ordered — ship inert, teach every legitimate pusher the options, then flip.
# A deployment turns it on by env (QITS_REPOSITORIES_GIT_PROTECT_DEFAULT_BRANCH=true); a single
# repository opts out with `[qits] protectDefaultBranch = false` in its own bare config, which needs
# no table (this service owns none) and travels with the volume.
qits.repositories.git.protect-default-branch=false

# qits.repositories.git.push-token is deliberately NOT declared here. It has NO default: unset means
# no `-o qits.token=<value>` matches, and a configured-empty value matches nothing either (never
# "empty allows empty"). So with protection on and no token configured there is no way to push the
# default branch directly at all, and the escape hatch exists only where a deployment
# (local-up, bootstrap) deliberately configures one. Releases go through qits-workspaces'
# POST /workspaces/api/workspaces/{id}/integrate, whose push carries `-o qits.release` and is
# fast-forward only.

# --- identity from the edge (migration-auth-plan.md) ---------------------------------------------
# The qits.auth.forward.* keys are NOT here. They ship from qits-auth-core, which now owns the
# mechanism that reads them, at this same ordinal (100) — and two files carrying one key at one
# ordinal make the winner arbitrary. A deployment still overrides them by env, exactly as before.
