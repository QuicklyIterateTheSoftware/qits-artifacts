# Service-layer config defaults, shipped from this library jar (ordinal 100; the consuming app's
# application.properties at 250 overrides them).
#
# Almost everything this file used to carry has left with the code that read it. The npm, maven and
# OCI keys ship from the qits-registries jars at this same ordinal — two files carrying one key at
# one ordinal make the winner arbitrary, so they are NOT restated here. The git host's keys
# (qits.ci.intake-url, qits.projects.intake-url, qits.repositories.git.*) went to qits-githost with
# the host itself, which publishes durable domain events instead of posting to an intake url.

# --- the wire body ceiling, and the numbers that must move together ------------------------------
# quarkus.http.limits.max-body-size is a global ceiling, but NOT a single hard gate. Quarkus enforces
# it in exactly two places (verified against 3.34.6):
#
#   1. HttpServerCommonHandlers.enforceMaxBodySize installs a route at order -2 on the SAME router
#      the registries' raw routes register on. It rejects a declared Content-Length over the limit
#      with a bare 413 + Connection: close, before any application handler runs. Nothing bypasses
#      this, custom Vert.x route or not.
#   2. For a CHUNKED body there is no Content-Length to compare, so that handler only stashes the
#      limit in the RoutingContext under "io.quarkus.max-request-size" and calls next(). The limit
#      is then applied by whatever reads the body: RESTEasy's VertxInputStream on /artifacts/api,
#      and io.quarkus.vertx.http.runtime.VertxInputStream on /v2 (see the registries' common
#      OciRequestBody). A raw route that reads HttpServerRequest itself is NOT gated at all — which
#      is why the registry never reads the body directly.
#
# Sized ABOVE qits.artifacts.oci.max-layer-size (1G, from the oci jar) on purpose. Were the two equal
# the wire 413 would always win — VertxInputStream compares bytesRead(), which runs ahead of what
# BlobStore has consumed — and the client would get an empty-bodied 413 with the connection reset
# instead of the OCI error envelope that explains itself. The slack is one ci-videos' worth:
#
#   1088M = 1 GiB (the OCI layer cap) + 64M slack
#     64M = the ci-videos type cap, unchanged
#     25M = the ci-screenshots type cap, unchanged
#
# It must never drop below 64M or ci-videos breaks silently. Config expressions cannot express a
# max(), so this is a literal that both consumers are named in.
#
# NOTE for the consuming deployment: this raises the ceiling for every route in this process. The
# tradeoff, and what an operator can actually do about it, is recorded in
# docs/issues/2026-07-19_artifacts-global-max-body-size-widens-public-ingest-dos.md in THIS repo.
quarkus.http.limits.max-body-size=1088M

