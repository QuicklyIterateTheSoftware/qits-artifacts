# The application config for qits-artifacts as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to META-INF/microprofile-config.properties at ordinal 100, which is how a context ships
# DEFAULTS it does not own the deployment of. That file keeps the blob store, the git host's
# data-dir, the CI notifier settings and the forwardauth contract; a deployment still overrides any
# of them by env.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# a private copy in src/test/resources and the packaged app had none.

quarkus.application.name=qits-artifacts

# The JAX-RS prefix. qits-gateway routes VERBATIM by prefix — /artifacts/* reaches this service with
# nothing rewritten — so the service itself has to serve the segment, and there is no unprefixed
# form. That holds for service-to-service calls on qits-net too, which never see the gateway.
#
# It governs /artifacts/api/** — but NOT the git host: eu.wohlben.qits.githost registers plain
# Vert.x routes at /artifacts/git/*, which sit outside the JAX-RS base and are unaffected by this.
# Those six routes carry the segment as a LITERAL in GitHostRoutes.init and move only when someone
# edits them. Both surfaces are verified against the packaged process, not just the suite, because
# they resolve through different machinery and only one of them moves when this value changes.
quarkus.rest.path=/artifacts/api

# Quarkus' non-application root — the framework's own surface (the OpenAPI document, swagger-ui,
# health) rather than application code. It sits OUTSIDE quarkus.rest.path and moves only with this
# key, so anything left at the root /q would be unreachable through the prefix-routing gateway.
# quarkus.swagger-ui.path is relative by default and follows automatically; do not pin it.
quarkus.http.non-application-root-path=/artifacts/q

# --- the API document -------------------------------------------------------------------------
# Served at /artifacts/q/openapi, with the browsable UI at /artifacts/q/swagger-ui — both under
# non-application-root-path above, not quarkus.rest.path. always-include because swagger-ui is a
# dev-mode-only extension by default, and the point of packaging these as processes is that each
# documents its own surface in a real deployment.
#
# The /artifacts/git/* routes are Vert.x, not JAX-RS, so they appear in no document. That is not an
# omission to fix: git smart-HTTP is a wire protocol, and the client that speaks it is `git`.
quarkus.smallrye-openapi.info-title=qits-artifacts API
quarkus.swagger-ui.always-include=true

# --- what a deployment MUST override -----------------------------------------------------------
# Deliberately NOT pinned here, because any value this repo picks would be wrong and wrong quietly:
#
#   qits.ci.intake-url    Where the git host's post-receive hook delivers CI events. Its default,
#                         http://localhost:${quarkus.http.port:8080}/ci/api/events/post-receive,
#                         meant "qits itself" when both contexts shared a process. Standalone that
#                         address is now THIS service, which has no intake — so every push notifies
#                         nothing and CI never runs. CiPostReceiveNotifier is fire-and-forget and
#                         swallows delivery failures at debug, so there is no error anywhere. Point
#                         the HOST at qits-ci on qits-net; the PATH is qits-ci's own segment and is
#                         a cross-repo contract — /ci/api/events/post-receive, not /api/ci/....
#
#   qits.artifacts.token  Blank means the write surface is unauthenticated. Dev default; a
#                         deployment sets it, together with qits.ci.token on both sides.
#
# qits.repositories.data-dir is NOT in that list but is worth naming: it is a shared on-disk
# contract. This service serves the bare origins that qits-projects clones into and qits-workspaces
# branches from, so all three must resolve it to the same volume or the git host serves an empty
# tree.
