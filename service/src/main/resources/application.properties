# The application config for qits-artifacts as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to META-INF/microprofile-config.properties at ordinal 100, which is how a context ships
# DEFAULTS it does not own the deployment of. That file keeps the blob store, the CI notifier
# settings and the forwardauth contract; a deployment still overrides any of them by env.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# a private copy in src/test/resources and the packaged app had none.

quarkus.application.name=qits-artifacts

# The JAX-RS prefix. qits-gateway routes VERBATIM by prefix — /artifacts/* reaches this service with
# nothing rewritten — so the service itself has to serve the segment, and there is no unprefixed
# form. That holds for service-to-service calls on qits-net too, which never see the gateway.
#
# It governs /artifacts/api/** — but NOT the git host: eu.wohlben.qits.githost registers plain
# Vert.x routes at /artifacts/git/*, which sit outside the JAX-RS base and are unaffected by this.
# Those six routes carry the segment as a LITERAL in GitHostRoutes.init and move only when someone
# edits them. Both surfaces are verified against the packaged process, not just the suite, because
# they resolve through different machinery and only one of them moves when this value changes.
quarkus.rest.path=/artifacts/api

# Quarkus' non-application root — the framework's own surface (the OpenAPI document, swagger-ui,
# health) rather than application code. It sits OUTSIDE quarkus.rest.path and moves only with this
# key, so anything left at the root /q would be unreachable through the prefix-routing gateway.
# quarkus.swagger-ui.path is relative by default and follows automatically; do not pin it.
quarkus.http.non-application-root-path=/artifacts/q

# --- the web UI -----------------------------------------------------------------------------------
# Quinoa builds src/main/webui (the qits-spa-artifacts submodule, an Angular SPA) during augmentation
# and serves the output as static resources. A fourth surface on the same port and the same gateway
# segment: /artifacts is the SPA, /artifacts/api is JAX-RS, /artifacts/q is Quarkus' own.
#
# ui-root-path is the segment itself, so the SPA is what /artifacts serves. It has to be spelled
# here AND as Angular's baseHref in the submodule's angular.json ("/artifacts/") — Quinoa mounts the
# files, the baseHref is what makes index.html ask for them at the right url, and a mismatch serves
# a page whose every asset 404s.
quarkus.quinoa.ui-root-path=/artifacts

# Deep links: /artifacts/<anything the SPA routes> has no file behind it, so without this a reload
# or a pasted link 404s and only the entry page works.
quarkus.quinoa.enable-spa-routing=true

# Angular's output. Quinoa detects Angular from `ng serve` in package.json and derives the same
# dist/<project>/browser from angular.json, but it is derived from a project NAME — pinning it means
# a rename in angular.json fails this build rather than resolving somewhere stale.
quarkus.quinoa.build-dir=dist/qits-spa-artifacts/browser

# What SPA routing must NOT swallow. The re-route is a catch-all route at /artifacts/* — late-order,
# so anything with a real route in front of it still wins, but a request that matches no route is
# rerouted to index.html and answers 200 HTML instead of 404. These prefixes are relative to
# ui-root-path above.
#
# Setting this key REPLACES Quinoa's defaults rather than adding to them, and its defaults are
# derived from quarkus.rest.path and quarkus.http.non-application-root-path — i.e. /api and /q. Both
# have to be repeated here, or naming /git alone would un-ignore them. The values are relative to
# ui-root-path, so they cannot be written as ${quarkus.rest.path} either: this list is a hand-kept
# copy of a derivation, and moving either key above means editing this line too.
#
#   /api  JAX-RS (quarkus.rest.path)
#   /q    openapi, swagger-ui, health (quarkus.http.non-application-root-path)
#   /git  the git host's raw Vert.x routes — the one Quinoa cannot derive, because no config key
#         names it (GitHostRoutes spells /artifacts/git as a literal). Its six routes match
#         first on their own, but the paths BETWEEN them — /artifacts/git/<repoId> with no
#         suffix, which is exactly what a user pastes — match nothing, and git wants the 404.
#
#   /npm  the npm registry's raw Vert.x routes — outside the derivation for the same reason as
#         /git: no config key names the segment, NpmRoutes spells /artifacts/npm as a literal. An
#         npm client handed index.html for a mistyped packument url parses a web page as JSON;
#         the 404 is the answer it can act on. Added when the npm registry and the SPA merged.
#
#   /maven the maven repository's raw Vert.x routes — the npm case verbatim: no config key names
#         the segment, MavenRoutes spells /artifacts/maven as a literal. A maven client handed
#         index.html for a mistyped artifact path reports a corrupt jar; the 404 is the answer it
#         can act on. PackagedProcessIT's maven cases are what assert it.
#
#   /v2   nothing is mounted at /artifacts/v2, and that is the point. The OCI registry lives at the
#         HOST ROOT because docker and podman resolve an image reference against <host>/v2/ and
#         accept no prefix; the gateway carries /v2 as an extra prefix on this service's entry
#         rather than under the segment. A deployment that gets that wrong and sends /artifacts/v2
#         must fail, and a 404 is how a registry client is told "not a registry here" — served the
#         SPA instead it gets 200 text/html with no Docker-Distribution-Api-Version header and
#         reports something that names neither the cause nor the fix. This is the only entry here
#         that ignores a path nothing serves, and PackagedProcessIT's
#         theRegistryIsMountedAtTheHostRootNotUnderTheArtifactsSegment is what asserts it.
#   /daemons the daemon-binaries wire's raw Vert.x routes — the npm and maven case verbatim: no
#         config key names the segment, DaemonRoutes spells /artifacts/daemons as a literal. This
#         one is the least forgiving of the four: a bootstrap script does `curl -o qits-ci-daemon`
#         and then execs the result, so index.html served at 200 becomes an executable that is a
#         web page, with the failure landing in a container nobody is watching.
quarkus.quinoa.ignored-path-prefixes=/api,/q,/git,/npm,/maven,/daemons,/v2

# gzip on the way out. The SPA bundle is 206 kB uncompressed and about 60 kB gzipped, and the
# explorer's JSON compresses harder than that again — a repository listing is mostly repeated key
# names.
#
# It has to be HERE and not in a deployment's environment: the key is BUILD_AND_RUN_TIME_FIXED, so
# an env var on the container is read, accepted and ignored, with no warning anywhere. The value
# that ships is the value that runs.
#
# quarkus.http.compress-media-types is deliberately LEFT UNSET. Setting it REPLACES Quarkus' default
# list rather than adding to it, so naming one type would silently stop compressing the other seven
# — and the default list is already what we want: text/*, application/json, application/javascript
# and the XML family, none of which is an image layer, a tarball or a git packfile. Those are
# already-compressed bytes served with sendFile, and re-compressing them would cost CPU to grow
# them.
quarkus.http.enable-compression=true

# --- the API document -------------------------------------------------------------------------
# Served at /artifacts/q/openapi, with the browsable UI at /artifacts/q/swagger-ui — both under
# non-application-root-path above, not quarkus.rest.path. always-include because swagger-ui is a
# dev-mode-only extension by default, and the point of packaging these as processes is that each
# documents its own surface in a real deployment.
#
# The /artifacts/git/* routes are Vert.x, not JAX-RS, so they appear in no document. That is not an
# omission to fix: git smart-HTTP is a wire protocol, and the client that speaks it is `git`.
quarkus.smallrye-openapi.info-title=qits-artifacts API
quarkus.swagger-ui.always-include=true

# --- what a deployment MUST override -----------------------------------------------------------
# Deliberately NOT pinned here, because any value this repo picks would be wrong and wrong quietly:
#
#   qits.ci.intake-url    Where the git host's post-receive hook delivers CI events. Its default,
#                         http://localhost:${quarkus.http.port:8080}/ci/api/events/post-receive,
#                         meant "qits itself" when both contexts shared a process. Standalone that
#                         address is now THIS service, which has no intake — so every push notifies
#                         nothing and CI never runs. CiPostReceiveNotifier is fire-and-forget and
#                         swallows delivery failures at debug, so there is no error anywhere. Point
#                         the HOST at qits-ci on qits-net; the PATH is qits-ci's own segment and is
#                         a cross-repo contract — /ci/api/events/post-receive, not /api/ci/....
#
#   qits.auth.machine.required
#                         Off means the JSON admin write surface is unauthenticated — network trust,
#                         the posture this service shipped with. A deployment that has qits-idp
#                         turns it on. See the machine-token block near the end of this file.
#
# Nothing about git storage is in that list any more, and the omission is the point: the git host
# keeps no directory, so it uses this service's own datasource and blob store and needs no path of
# its own. The shared repositories volume qits-projects and qits-workspaces once had to resolve to
# the same place is gone.

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-artifacts` rather than qits-artifacts-service-<version>-runner, so
# `-Dnative` produces target/qits-artifacts and the process is identifiable in `ps` / `docker top`.
# The failsafe plugin's native.image.path in service/pom.xml spells the same name; they move
# together.
quarkus.package.output-name=qits-artifacts
quarkus.package.jar.add-runner-suffix=false

# --- telling native-image about JGit ------------------------------------------------------------
# JGit is NOT a Quarkus extension: nothing registers its reflection, its ServiceLoader providers or
# its resources on its behalf, and every one of these gaps fails at RUNTIME in the binary while the
# @QuarkusTest suite stays green. PackagedProcessIT is what catches them, and each line below exists
# because it did.
#
# Both entries are JGit statics that native-image refuses to freeze into the image heap, and both
# sit on the path FileRepositoryBuilder.build takes — i.e. on every git request, so neither can be
# excluded instead:
#
#   util.FileUtils          a static java.util.Random (retry jitter in delay()). A build-time
#                           instance carries a fixed seed: "Detected an instance of
#                           Random/SplittableRandom class in the image heap".
#   lib.internal.WorkQueue  a static ScheduledThreadPoolExecutor, already running by the time the
#                           class initialiser finishes: "Detected a started Thread in the image
#                           heap. Thread name: JGit-WorkQueue". A thread started in the builder is
#                           not running in the binary.
#   ...file.WindowCache     another static java.util.Random, this one the eviction jitter of the
#                           mmap window cache — reached from RefAdvertiser.send, so it is on the
#                           info/refs path too.
#   ...dfs.DfsBlockCache    the analogue of WindowCache on the storage this host actually serves: a
#                           large static cache, seeded with a java.util.Random for its eviction
#                           jitter, reached from the first object read of a repository.
#
# WindowCache stays although no repository is file-backed any more: UploadPack/ReceivePack pull
# JGit's file-storage classes in regardless, and the failure mode if that is wrong is a silent 404
# on every git route in the binary. It is one flag against a whole host; measuring it is not worth
# the outage.
quarkus.native.additional-build-args=--initialize-at-run-time=org.eclipse.jgit.util.FileUtils,--initialize-at-run-time=org.eclipse.jgit.lib.internal.WorkQueue,--initialize-at-run-time=org.eclipse.jgit.internal.storage.file.WindowCache,--initialize-at-run-time=org.eclipse.jgit.internal.storage.dfs.DfsBlockCache

# --- where git repositories live ----------------------------------------------------------------
# Nowhere on disk. A repository is a JGit DfsRepository whose packs, pack indexes and refs are blobs
# in this service's own content-addressed store, listed by rows in the artifacts lineage (V4/V5).
# There is no key to pick a backend: bare origins on a shared volume were the second one, they ran
# beside this for a release cycle, and both they and the volume are gone.
#
# The git host's rows join the artifacts persistence unit rather than opening a second datasource
# (git-host-storage-unification-plan.md, decision ⚖5): one datasource, one Flyway lineage, and the
# "the git host owns no tables at all" invariant amended in writing rather than left standing and
# false.
#
# Setting this key REPLACES the value the artifacts jar ships in its
# META-INF/microprofile-config.properties, so the entity package that was already there has to be
# repeated here. It is spelled in THIS module rather than in that file because
# eu.wohlben.qits.githost.persistence is not on the artifacts module's classpath at all — naming it
# there would break `mvn test` in a module that has never heard of the git host.
quarkus.hibernate-orm.artifacts.packages=eu.wohlben.qits.artifacts.entity,eu.wohlben.qits.githost.persistence

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path, the same
# shape as qits.projects.url. The ingest path is qits-observability's own and belongs to the
# service, not to the deployment, so it is spelled once here and derived rather than configured.
# Point this at a collector or a different host and everything below follows.
qits.observability.url=http://qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base — so this resolves to the three ingest routes at
# /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# The bridge itself is proven in qits-events, whose OtelLogBridgeTest decodes a real
# ExportLogsServiceRequest and whose PackagedLogBridgeIT repeats it against the packaged artifact.
# The extension and this configuration are the same here, so this repo carries no second copy of
# that proof — only OtelLogConfigTest, which pins these four keys and the exporter they ride.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- machine tokens from qits-idp (qits-idp-plan.md phase 1) --------------------------------------
# Two tracks of identity meet here. USERS keep arriving as qits-gateway's X-Qits-User header, read by
# qits-auth-core's ForwardAuthMechanism — unchanged, and untouched by anything below. MACHINES arrive
# with a bearer token minted by qits-idp; quarkus-oidc validates it and MachineAuth decides what it
# permits.
#
# This service's own id, which is the `aud` its tokens must carry. `require()` in a guard therefore
# already means "a token minted for me" and never one meant for qits-ci.
qits.auth.machine.audience=qits-artifacts

# THE ROLLOUT GATE, and the one switch a deployment flips. Off (the shipped default, from
# qits-auth-core) every MachineAuth.require* call returns at once and every guarded endpoint behaves
# exactly as it did before qits-idp existed — network trust, no bearer needed. On, the same call
# demands a validated token addressed to qits-artifacts.
#   QITS_AUTH_MACHINE_REQUIRED=true
#
# The OIDC tenant follows the gate rather than being enabled on its own. That is what lets this
# service ship its enforcement code first: with the gate off there is no tenant, so nothing fetches a
# JWKS, nothing waits on a host named qits-idp, and a clone-alone `./mvnw verify` needs no issuer at
# all. There is no third state — either the gate and the validation are both on, or both off.
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}

# Authenticate lazily, when a guarded JSON endpoint asks for SecurityIdentity. The raw OCI, npm,
# Maven and git routes deliberately use qits-net trust; npm nevertheless sends its mandatory dummy
# _authToken on publish. Proactive auth would parse that ceremony as an OIDC bearer and reject the
# request before the tokenless Vert.x route can see it. MachineAuth-backed endpoints still trigger
# normal bearer validation because their request path resolves SecurityIdentity.
quarkus.http.auth.proactive=false

# Bearer-only. This service starts no login flow and holds no session; a request with no
# Authorization header is not challenged, it falls through to forward-auth and stays user traffic.
quarkus.oidc.application-type=service

# Reached DIRECT on qits-net, never through the gateway. Discovery is off because the fetch is
# internal while the issuer string is a public URL, so the JWKS path is given rather than looked up;
# it is joined onto auth-server-url, which is why it reads `jwks` and not `/idp/jwks`. Set
# quarkus.oidc.token.issuer as well the day the two diverge.
quarkus.oidc.auth-server-url=http://qits-idp:8080/idp
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks

# Belt and braces with MachineAuth's own audience check: a token minted for another service is
# rejected as invalid here, before any guard runs.
quarkus.oidc.token.audience=${qits.auth.machine.audience}

# --- the token this service PRESENTS to qits-ci ---------------------------------------------------
# The git host's post-receive events are the one outbound call this service makes to a guarded
# endpoint (CiPostReceiveNotifier -> qits.ci.intake-url). qits-ci wants a bearer with aud=qits-ci
# whose `project` claim covers the event's project; this service hosts EVERY project's repositories,
# so its client at the idp is granted `project=*` rather than one project name.
#
# DISABLED by default, and that is the "behaves exactly as today" half: with no client credentials
# there is nothing to fetch a token from, so the notifier posts without a bearer, as it always has.
# A deployment turns it on together with the secret:
#   QUARKUS_OIDC_CLIENT_CLIENT_ENABLED=true
#   QITS_ARTIFACTS_CLIENT_SECRET=<this service's secret in qits-idp's client config>
# Enabling it without the secret fails the boot rather than posting unauthenticated.
quarkus.oidc-client.client-enabled=false

# The same idp, spelled once above. token-path is joined onto it, so it is `token`, not `/idp/token`.
quarkus.oidc-client.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=token
quarkus.oidc-client.client-id=qits-artifacts
quarkus.oidc-client.credentials.secret=${QITS_ARTIFACTS_CLIENT_SECRET:}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.grant-options.client.audience=qits-ci

# --- long uploads on a worker thread -------------------------------------------------------------
# Vert.x' BlockedThreadChecker logs a warning WITH A FULL STACK TRACE whenever an executeBlocking
# task outruns quarkus.vertx.max-worker-execute-time, which defaults to 60 seconds. It aborts
# nothing — but the registry's blob PATCH holds its worker for as long as the client is sending, and
# a 1 GB layer is minutes on any link worth calling slow, so the default turns every large
# `docker push` into a wall of stack traces that buries real warnings.
#
# ISO-8601 rather than a bare number, which Quarkus reads as seconds. This also raises the threshold
# for the git host's blocking handlers, which are the same shape of work (a large clone or push held
# on a worker) and want the same answer.
#
# What bounds a stalled client instead is qits.artifacts.oci.upload-idle-timeout — a per-chunk wait,
# so a client that has stopped sending is dropped in a minute while a slow but progressing one runs
# to completion.
quarkus.vertx.max-worker-execute-time=PT30M
