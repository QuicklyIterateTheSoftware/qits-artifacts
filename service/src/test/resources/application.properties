# TEST-ONLY OVERRIDES. Nothing else belongs in this file.
#
# Quarkus MERGES src/main/resources/application.properties into the test config — it is not shadowed
# by this file. So every app-level setting (quarkus.application.name, quarkus.rest.path, the openapi
# settings, ...) is already in effect here, and must NOT be re-declared: a test copy that drifts from
# the shipped copy makes the suite pass on a value the packaged process never sees, and the suite
# then proves nothing about what ships. Only put a key here when the test genuinely needs a
# DIFFERENT value from the deployed one, and say why.
#
# The suite runs against in-memory H2 (no docker), overriding the file-H2 default shipped in the
# artifacts jar's META-INF/microprofile-config.properties. Its Flyway lineage is separate and
# unchanged; clean-at-start wipes between runs.
quarkus.datasource.artifacts.db-kind=h2
quarkus.datasource.artifacts.jdbc.url=jdbc:h2:mem:artifacts-svc;DB_CLOSE_DELAY=-1
quarkus.flyway.artifacts.clean-at-start=true

# Keep blob bytes under target/ (never the real ~/.qits home the jar default points at).
# The git host's packs and refs are blobs in that same store, so this covers them too.
qits.artifacts.blobs-dir=target/artifacts-svc-test-blobs

# There is no CI intake in this repo — ci is its own submodule. The notifier is fire-and-forget and
# swallows delivery failures at debug, so a closed port is the honest test posture: the push
# succeeds, the event is attempted, nothing is asserted about its arrival.
qits.ci.intake-url=http://localhost:1/post-receive
# Same reasoning for the second consumer of that event: qits-projects is another submodule, and its
# intake is where a push turns into a backup push to GitHub.
qits.projects.intake-url=http://localhost:1/post-receive

# qits.projects.name-resolver-url stays UNSET here on purpose — not even a closed port. The suite's
# resolver is FakeRepositoryNameResolver, which overrides the shipped @DefaultBean adapter, so
# nothing under @QuarkusTest reads this key; leaving it unset is also what keeps the packaged
# process's own "no resolver configured" path the one the suite runs. The HTTP adapter is proved
# against its own in-process stub by HttpRepositoryNameResolverTest, outside CDI.

# Same reasoning for GC's two pin sources: qits-platform-deployments and qits-ci are other submodules, the suite has no
# network, and closed ports refuse at once instead of costing a DNS timeout on every plan request.
# The plan endpoint then answers non-executable with the pin-dependent types failed, and the sweep
# aborts whole — the behaviour GcPlanControllerTest asserts on the wire.
quarkus.http.test-port=0
qits.artifacts.gc.pins.cd-base-url=http://localhost:1/platform-deployments/api
qits.artifacts.gc.pins.ci-base-url=http://localhost:1/ci/api

# And the same for the OCI mirror, where it matters more than anywhere else in this file: the three
# prefilled upstreams are REAL public registries, and clean-at-start wipes only once per run, so
# without this every test that touches /v2/quay/... or /v2/hub/... would dial quay.io or Docker Hub
# for real. A closed port refuses at once, which is the honest offline posture — a cold miss answers
# 502 saying the upstream is unreachable. The suites that actually exercise the miss path override
# this per-profile with an in-process stub registry (registry/StubOciRegistry).
qits.artifacts.oci.mirror.endpoint-override=http://localhost:1
