# The gc module's own defaults, shipped in its jar beside the code that reads them.
#
# Only keys this module reads live here. `qits.artifacts.gc.blob-grace-period` stays in the
# artifacts jar, because BlobStore reads it and the store is where the window is enforced.
#
# The type -> (strategy, window) mapping is the user's settlement of 2026-08-05
# (artifacts-gc-plan.md, "Settlement"): two engines, configured per type. A deployment overrides any
# line below with an environment variable — QITS_ARTIFACTS_GC_TYPE_OCI_MIRROR_WINDOW and kin — and
# needs no code change, which is what "changeable anytime" meant.
#
# Every RepositoryType constant must appear here. A type with no entry is refused rather than
# defaulted (GcTypeConfig.of), because a type nobody configured is a decision nobody took.

# Caches: re-fetchable content from somebody else's registry. Everything unaccessed ages out.
qits.artifacts.gc.type.oci-mirror.strategy=cache
qits.artifacts.gc.type.oci-mirror.window=P30D
qits.artifacts.gc.type.npm-proxy.strategy=cache
qits.artifacts.gc.type.npm-proxy.window=P30D

# The platform's own artifacts: the last released versions stay, the rest ages out.
qits.artifacts.gc.type.oci-images.strategy=own
qits.artifacts.gc.type.oci-images.window=P30D
qits.artifacts.gc.type.npm-packages.strategy=own
qits.artifacts.gc.type.npm-packages.window=P30D
# P90D rather than P30D: a library is resolved when something builds against it and a daemon binary
# when a runner starts, and neither cadence is a month.
qits.artifacts.gc.type.maven-packages.strategy=own
qits.artifacts.gc.type.maven-packages.window=P90D
qits.artifacts.gc.type.daemon-binaries.strategy=own
qits.artifacts.gc.type.daemon-binaries.window=P90D

# The two CI types: no strategy configured for now, reported honestly (settlement). Their intended
# rules are written down in CiScreenshotsGcStrategy and CiVideosGcStrategy. No window, because a
# window beside a type nobody collects reads as a rule that is running.
qits.artifacts.gc.type.ci-screenshots.strategy=excluded
qits.artifacts.gc.type.ci-videos.strategy=excluded
