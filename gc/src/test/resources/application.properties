# The gc module's own test suite: in-memory H2 on the named `artifacts` datasource, no docker, no
# variant flag. Overrides the file-H2 default shipped in the artifacts jar's
# META-INF/microprofile-config.properties, exactly as that module's own suite does.
#
# Its own database name, not `artifacts`: two modules' suites can run in one build, and a shared
# in-memory url with DB_CLOSE_DELAY=-1 outlives the JVM's first Quarkus instance.
quarkus.datasource.artifacts.db-kind=h2
quarkus.datasource.artifacts.jdbc.url=jdbc:h2:mem:artifacts-gc;DB_CLOSE_DELAY=-1

quarkus.flyway.artifacts.migrate-at-start=true
quarkus.flyway.artifacts.clean-at-start=true
quarkus.flyway.artifacts.locations=classpath:db/artifacts/migration

# Blob bytes under target/ (GcFixture wipes this + the tables before each test).
qits.artifacts.blobs-dir=target/artifacts-gc-test-blobs

# There is no qits-cd in this repo, and the suite has no network. A closed port is the honest posture
# rather than a hostname that costs a DNS timeout: the oci-images strategy's fetch is refused at once
# and the plan aborts fail-closed, which is the behaviour GcPlanTest asserts. Strategy-level cases
# fake the port directly and never reach this.
qits.artifacts.gc.oci.cd-base-url=http://localhost:1/cd/api
