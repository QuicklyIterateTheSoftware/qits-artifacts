# The per-commit userflow run: `mvn verify` at the pushed commit — which regenerates
# service/target/userstories/ through TokenValidationBootstrapIT (the token stories) and
# ExplorerBrowseIT (the browser story over the embedded SPA) — and the reports published as one
# docs bundle, site @userflows/qits-artifacts, version = the bare commit sha, branch riding as
# artifacts metadata for discovery. qits-githost's file of the same name is the pattern; this one
# departs from it in two ways, and the web UI is the reason for both.
#
# ONE STEP, BECAUSE STEPS SHARE NOTHING. Every step container clones the repository for itself
# (the ci-daemon's Workspace clones into the container's own /workspace), so a bundle built in one
# step does not exist in the next — the two-step split this file shipped with was structurally
# wrong and never survived its first run. The whole journey therefore happens in one container:
# the browser story drives the SPA the packaged jar itself serves (Quinoa), so the jar under test
# must carry the real client, and the client must be built HERE, on qits-net, where the @qits
# scope resolves.
#
# ON userflows-base, BECAUSE THE STEP NEEDS EVERYTHING AT ONCE: Maven + JDK, Chromium at
# PLAYWRIGHT_BROWSERS_PATH for the browser story, and the step-image contract (passwd user,
# /workspace 1777 — since qits-oci 2026.828.162434, this image carries it). Node is deliberately
# NOT assumed: Quinoa's managed install fetches its own node (the pinned 22.22.0, the same version
# docker/Dockerfile pins) and runs the REAL npm ci + build with it — the registry redirection
# rides in as npm_config_* environment, which outranks the submodule's committed .npmrc.
#
# `user: pwuser`, and NOT a switch inside the script: the suite starts zonky's embedded postgres,
# initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed non-root
# user — pwuser is the one the Playwright image bakes (and userflows-base now guarantees).
#
# NON-GATING BY DESIGN, which is why it is a separate file from ci-event-build.yml: this run going
# red must not cost the branch its image while "quality gate before merging" is still a decision to
# be taken — when it is, these per-commit runs are what the gate reads. One run per push per
# branch, collapsed to the newest tip under burst.
#
# LET OUR OWN DEPLOY SETTLE, FIRST THING. This repo IS the registry everything below dials: the
# runner serializes this run behind ci-event-build.yml's, whose BuildSuccessful makes qits-cd swap
# the very container that serves the maven jars, the npm tarballs and the docs PUT — measured
# 2026-08-28, twice: the follow-on container's first fetch died ~20s after the build went green,
# mid-swap. The hold sits at the top of the script (the daemon bootstrap that starts this
# container wins the race by starting immediately; everything after must wait the swap out). No
# sibling needs this: no sibling's deploy blinks the store its own pipeline reads.
#
# The docs publish below lands in the DEPLOYED qits-artifacts — this repo's own service, the same
# already-running-while-we-build fact ci-event-build.yml leans on: the run tests the pushed
# commit, the platform's docs registry is whatever is deployed, and nothing here bootstraps from
# the artifact it produces.
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit — no cycle. Publish-if-absent:
# events redeliver and docs versions are immutable, so 409 is success (the qits-spa-ui-components
# release file's discipline).
event: SCMPublishCommit
when:
  - repoId: { exact: qits-artifacts }
    suppressCi: { exact: "false" }
checkout:
  branch: branch
  sha: sha
steps:
  - image: qits/build-images/userflows-base:latest
    user: pwuser
    timeout-seconds: 2400
    script: |
      set -eu
      # The settle-hold from the header: our own build's deploy is swapping the registry container
      # about now, and everything below — the submodule fetch, npm, maven, the docs PUT — dials it.
      sleep 120

      # The submodule fetch under the OLD .gitmodules entry name, and the lockfile origin swap
      # (broad proxy sed FIRST, narrow @qits sed SECOND) — ci-event-build.yml's half one carries
      # the long form of every rule here, and the two should keep matching. Origins are derived
      # with sed rather than node -p: this image deliberately carries no node of its own.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-spa-artifacts"
      git -c submodule.qits-platform-spa-artifacts.url="$frontend_url" submodule update --init service/src/main/webui
      npm_hosted_origin=$(echo "$QITS_NPM_REGISTRY_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
      npm_proxy_origin=$(echo "$QITS_NPM_PROXY_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
      npm_hosted_path=$(echo "$QITS_NPM_REGISTRY_URL" | sed -E 's#^https?://[^/]+##')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        service/src/main/webui/package-lock.json

      # The registry redirection for the npm Quinoa is about to run: npm_config_* environment
      # outranks the submodule's committed .npmrc, and Quinoa's child processes inherit it.
      export npm_config_registry="$QITS_NPM_PROXY_URL"
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"

      # The platform maven registry exactly as qits-eventstream's step derives it, plus Quinoa's
      # MANAGED node: this image carries none, so the extension downloads its pinned 22.22.0 and
      # runs the real install + build with it. quinoa.ci=true pins `npm ci` regardless of the
      # container's CI envs. The scoped-registry variable needs the env wrapper — `@` and `:` are
      # not assignable in a shell prefix.
      env "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
        ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa.package-manager-install=true \
        -Dquarkus.quinoa.package-manager-install.node-version=22.22.0 \
        -Dquarkus.quinoa.ci=true

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-artifacts" \
        "$QITS_DOCS_URL/@userflows/qits-artifacts/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-artifacts@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-artifacts@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
