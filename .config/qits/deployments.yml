# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is
# the trunk push alone — and then promotes onto the branch it is configured with
# (`qits.workspaces.release.entry-branch`). `deploy_branches` used to name that branch here, in
# thirteen copies of one platform-wide answer, and a release pushed onto every entry it named.
#
# PLATFORM service: this is the one store every environment publishes to and pulls from, so one
# instance exists rather than one per tier. It deploys from the PLATFORM ENVIRONMENT's branch
# and no other tier's — which tier that is, is `pd_environment.platform` in the deployer, set by
# the bootstrap's --platform-env.
deployment_target: platform

# The convention would derive the health path from the repository name, but the route path
# deliberately did not move with the rename — the service still serves /artifacts. Without this line
# the deployer probes a 404 and rolls every deployment back as unhealthy.
health_path: /artifacts/q/health/ready
