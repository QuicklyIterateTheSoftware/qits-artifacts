# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is
# the trunk push alone — and then promotes onto the branch it is configured with
# (`qits.workspaces.release.entry-branch`). `deploy_branches` used to name that branch here, in
# thirteen copies of one platform-wide answer, and a release pushed onto every entry it named.
#
# ENVIRONMENT service since the byte-plane split: one hosted store per tier, and the wire alias
# carries the tier (dev-qits-artifacts). The platform-wide pieces this repo used to bundle live
# in services of their own now — the third-party cache is qits-platform-mirror, git is
# qits-githost. The old `deployment_target: platform` outlived the split here and cost a
# measured deployment: the deployer ran the platform plane, its predecessor search could not
# match the tier-named seed container, and the successor died binding the port the seed still
# held.
deployment_target: environment

# A postgres role and database of this application's own (qits_artifacts by derivation), created
# on the tier's postgres BEFORE the successor starts and injected as QITS_RESOURCE_DB_URL /
# _USERNAME / _PASSWORD. Declared AHEAD of the PostgreSQL cutover on purpose: the running H2
# image ignores the injected triple, so the next deploy provisions the role and database while
# nothing depends on them yet, and cutover day starts with credentials that already exist
# (qits-artifacts-postgresql-plan.md §9.1).
resources: postgresql:db

# The convention would derive the health path from the repository name, but the route path
# deliberately did not move with the rename — the service still serves /artifacts. Without this line
# the deployer probes a 404 and rolls every deployment back as unhealthy.
health_path: /artifacts/q/health/ready

# STOP-FIRST, because this deployment publishes a host port. Under start-first the successor
# waits in Pending for a port the predecessor only frees by stopping — which start-first never
# does — so a one-node swarm deadlocks on the first rolling update. A single binder cannot have
# the lossless-rollback overlap; the deploy takes the brief gap instead. Measured live on
# qits-platform-mirror's 2026.813.163303 deploy, the first host-port update since the swarm
# cutover (2026-08-13).
update_order: stop-first
