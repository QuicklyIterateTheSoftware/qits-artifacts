# Follow the webui submodule's releases.
#
# THE REPOSITORY IS NAMED qits-artifacts-frontend since the phase-2 renames. It was
# qits-spa-artifacts, and before that qits-platform-spa-artifacts. A git host serves the current
# name and only the current name — an old spelling here is a 404 or a trigger that never fires, as
# measured on the 2026-08-12 proving rebootstrap — so all three places that say it (the trigger's
# `exact:`, the derived clone URL, the `-c` key) move together.
#
# THE `-c` KEY IS THE .gitmodules ENTRY NAME, not the repository's: it is what
# `submodule.<name>.url` is written under. The entry was renamed with the repository in this same
# commit, so the two agree again. An existing CHECKOUT keeps its old module directory; CI clones
# fresh, so nothing here has to care.
event: SCMRelease
when:
  - repository: { exact: qits-artifacts-frontend }
steps:
  - image: qits/build-images/node-base:latest
    timeout-seconds: 600
    script: |
      set -eu
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-artifacts-frontend"
      git -c submodule.qits-artifacts-frontend.url="$frontend_url" submodule update --init service/src/main/webui
      git -C service/src/main/webui fetch "$frontend_url" "refs/tags/$version:refs/tags/$version"
      git -C service/src/main/webui checkout --detach "$version"
      target=$(git -C service/src/main/webui rev-parse HEAD)
      current=$(git ls-tree HEAD service/src/main/webui | awk '{print $3}')
      if [ "$current" = "$target" ]; then exit 0; fi
      git update-index --add --cacheinfo 160000,$target,service/src/main/webui
      git -c user.name="qits release train" -c user.email="release-train@qits.local" commit -q -m "bump(qits-artifacts-frontend@$version): follow qits-artifacts-frontend"
      git push --force "$QITS_CI_REPOSITORY_URL" HEAD:refs/heads/maintenance/frontend
