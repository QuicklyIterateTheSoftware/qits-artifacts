# Follow the webui submodule's releases.
#
# THE REPOSITORY IS NAMED qits-spa-artifacts. It was qits-platform-spa-artifacts, and the wrapper
# renamed it; a fresh git host serves the new name and only the new name, so every spelling of the
# old one here — the trigger's `exact:`, the derived clone URL — was a 404 or a trigger that never
# fired. Measured 2026-08-12, on the proving rebootstrap.
#
# The .gitmodules ENTRY is still called qits-platform-spa-artifacts, which is why the `-c` override
# below still is: an entry name is the key `submodule.<name>.url` is written under, and renaming it
# would move the module directory of every existing checkout. Only its `url` changed, to the
# relative `../qits-spa-artifacts.git` the house rule asks for.
event: SCMRelease
when:
  - repository: { exact: qits-spa-artifacts }
steps:
  - image: qits/build-images/node-base:latest
    timeout-seconds: 600
    script: |
      set -eu
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-spa-artifacts"
      git -c submodule.qits-platform-spa-artifacts.url="$frontend_url" submodule update --init service/src/main/webui
      git -C service/src/main/webui fetch "$frontend_url" "refs/tags/$version:refs/tags/$version"
      git -C service/src/main/webui checkout --detach "$version"
      target=$(git -C service/src/main/webui rev-parse HEAD)
      current=$(git ls-tree HEAD service/src/main/webui | awk '{print $3}')
      if [ "$current" = "$target" ]; then exit 0; fi
      git update-index --add --cacheinfo 160000,$target,service/src/main/webui
      git -c user.name="qits release train" -c user.email="release-train@qits.local" commit -q -m "bump(qits-spa-artifacts@$version): follow qits-spa-artifacts"
      git push --force "$QITS_CI_REPOSITORY_URL" HEAD:refs/heads/maintenance/qits-spa-artifacts
