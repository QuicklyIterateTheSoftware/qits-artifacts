# The image build, per push — this repository's ci-post-receive.yml MOVED HERE when the repo went
# domain-event-only (qits-githost's conversion is the pattern). `checkout:` is what makes that a
# move rather than a rewrite: the run builds the pushed branch at the pushed sha
# (QITS_CI_BRANCH/QITS_CI_SHA are the payload's), so the build step below is the old file's,
# byte-identical, and BuildSuccessful still announces the branch the deployer keys on. The one
# semantic the push path had that when: has to restate is suppressCi — the listener honoured
# `-o qits.no-ci` before any pipeline was read; here it is a selection like any other.
#
# NOT QUITE THE ONE-FILE MOVE qits-githost made: the old file's second step — the maintenance bump
# train's release call — could not come along, because an event pipeline's steps may not carry
# `branches:` (the run's branch is the trigger's single decision, resolved from the payload before
# any step exists, so qits-ci rejects the key). It is ci-event-maintenance-release.yml now,
# selected by the same branch prefix in `when:`.
#
# DELIBERATELY A SEPARATE FILE from ci-event-userflows.yml: that run is the per-commit verify +
# docs publish and is non-gating by design — a red verify must not cost a branch its image, until
# the quality gate becomes a decision someone takes. A push fires at most three runs (build +
# userflows always, the release call on maintenance/* only), collapsed to the newest tip per
# branch under burst.
#
# Loop review (qits-githost's checkout box): this pipeline pushes an image and never a commit, and
# selects no event its own green run publishes — no cycle.
event: SCMPublishCommit
when:
  # repoName, not repoId: the git host's own coordinate can be an opaque UUID since the
  # identity cutover, so a name match on repoId is not dependable. The push event echoes the
  # public name the push was addressed with, which always is; a rename updates this line in
  # the same campaign.
  - repoName: { exact: qits-artifacts-service }
    suppressCi: { exact: "false" }
checkout:
  branch: branch
  sha: sha
# The step below is ci-post-receive.yml's build step, unchanged. Its own header rules, still
# binding:
#
# One step, two halves, and the split between them is the whole point:
#
#   1. build the artifacts client (service/src/main/webui = the qits-artifacts-frontend
#      submodule) HERE, in the step container, which sits on qits-net and can therefore reach the
#      platform's own npm registry — where @qits/ui-components lives and where nothing else can
#      reach it from;
#   2. build this repo's docker/Dockerfile, whose builder stage packages that already-built bundle
#      and never runs an install.
#
# The Docker build runs on HOST networking and Maven resolves qits-auth-core from the artifacts
# store at its host-published address. NOT a custom network: buildkit — the builder format the
# platform targets, because a swarm cannot assume the legacy builder — refuses custom networks on a
# build. The address is still derived rather than spelled, from the same injected $QITS_REGISTRY the
# image tag uses. The frontend builds in this step container, which sits on qits-net and reaches the
# npm registry by that service alias; the step needs node, npm and git for half one and the docker
# CLI for half two.
# The same split, for the same reason, as qits-gateway's pipeline and every webui-carrying sibling's
# — they should keep matching.
#
# --- the one thing no sibling has to think about: this repo IS that registry --------------------
# $QITS_NPM_PROXY_URL and $QITS_NPM_REGISTRY_URL are
# http://qits-platform-artifacts:8080/artifacts/npm/… — this service, on qits-net. So half one dials
# the very container this run is about to replace, and that is fine, because of WHEN: the currently
# deployed qits-platform-artifacts serves the install while the new image is still being built, and
# qits-cd does not swap it until the run is green and the image is pushed. Nothing here bootstraps
# from the artifact it produces.
#
# What it does mean is that this repo's pipeline has a dependency the siblings' do not: a run here
# cannot be green while qits-platform-artifacts is down, and the deploy at the end of it blinks the
# git host, the npm registry and the OCI registry at once — every other repo's builds included.
# Which is why this repo is deployed alone, with nothing else in the queue.
#
# Half two publishes under the tag that is the whole contract with qits-cd —
# <registry>/<repository>/<this repo's name>:<sha>. The step's own container only drives the docker
# CLI; the build and the push happen in the host's daemon through the socket this step declares
# (docker: true). A failed push is a failed step is a FAILED run.
steps:
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed docker build is
      # swallowed: the push fails, `docker rmi || true` answers 0, the run reports SUCCESS, and cd
      # is told an image exists that does not (the exact shape of the qits-workspaces
      # IMAGE_MISSING incident). -u is load-bearing too: an unset registry variable must stop the
      # step, not quietly resolve the @qits scope against npmjs.org, where those packages do not
      # exist and never will.
      set -eu

      # The daemon's clone is `--depth 50` and does not recurse, so the qits-artifacts-frontend submodule
      # at service/src/main/webui arrives as an empty directory — and Quinoa fails the image build on
      # exactly that (`No package.json found in Web UI directory`). Initialising it here rather than
      # asking the daemon to clone differently keeps the submodule this repo's business: it is a
      # public GitHub repo needing no credentials, and one shallow fetch.
      #
      # THE REPOSITORY IS NAMED qits-artifacts-frontend since the phase-2 renames. It was
      # qits-spa-artifacts, and before that qits-platform-spa-artifacts. A git host serves the
      # current name only, so an old spelling here is a 404 on every run — measured 2026-08-12, on
      # the proving rebootstrap. The `-c` key is the .gitmodules ENTRY name, which is what
      # `submodule.<name>.url` is written under; the entry was renamed with the repository, so the
      # two agree.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-artifacts-frontend"
      git -c submodule.qits-artifacts-frontend.url="$frontend_url" submodule update --init service/src/main/webui

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. Same problem
      # and same fix as qits-artifacts-frontend's own pipeline — that repo's recipe is where this
      # pattern is maintained, and the two should keep matching.
      #
      # npm pins a full resolved URL per package, and qits-artifacts-frontend's lockfile is
      # generated on the deployment host, so every entry names a localhost port — an address that
      # does not exist in this container. `npm ci` fetches tarballs by that URL and never asks the
      # configured registry for them, so the environment below does not reach them: without this
      # swap the install dies on connection refused. The paths are identical on every address, so
      # replacing the ORIGIN and keeping the path is all it takes, and the integrity hashes are what
      # make that safe — bytes from the other address must still hash the same. The checkout is this
      # step's own; nothing is edited that anyone will ever read again.
      #
      # THE BYTE PLANE IS TWO SERVICES SINCE THE SPLIT, WHICH IS WHY THE SWAP READS THE PATH.
      # qits-platform-mirror holds the npmjs pull-through cache; qits-artifacts hosts the @qits
      # scope. No single origin serves both, so the path is what tells them apart: an entry under
      # the hosted registry's own pathname — $QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/ — is a
      # @qits tarball and gets the hosted origin, and every other entry gets the proxy's. One sed
      # covered both roots while they shared an origin; since the split it sends every @qits tarball
      # to the mirror, which has never held one: 404, on every run.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line, so
      # the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits entries
      # after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either.
      # @npmcli/arborist glues rather than resolves (reify.js:
      # `registry.slice(0, -1) + resolvedURL.pathname`), so
      # http://qits-platform-mirror:8080/artifacts/npm/npmjs/ + /artifacts/npm/npmjs/zone.js/-/…tgz
      # comes out as …/artifacts/npm/npmjs/artifacts/npm/npmjs/zone.js/-/…tgz and every tarball
      # 404s. Measured on npm 10.9.4.
      #
      # Every address is derived from the injected env rather than spelled here: no repository
      # states a deployment's addresses, and the two qits-artifacts-frontend does state
      # (registry.dev.localhost:8080 for the @qits scope and mirror.dev.localhost:8080 for npmjs, in
      # its .npmrc, for a developer on the host) are the ones being replaced.
      cd service/src/main/webui
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. qits-artifacts-frontend COMMITS an .npmrc (registry.dev.localhost:8080
      # for @qits and mirror.dev.localhost:8080 for npmjs, right for a developer on the host), and
      # npm ranks a project .npmrc ABOVE ~/.npmrc — so a `cat > ~/.npmrc` preamble would be written
      # and silently ignored. `npm_config_*` environment outranks both files, so it wins without
      # touching the submodule's tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-spa-artifacts/browser — the bundle the image build consumes (it is
      # quarkus.quinoa.build-dir in service/src/main/resources/application.properties), and the ONE
      # artifact this half exists to produce. Lint and test are qits-artifacts-frontend's own
      # pipeline's job; repeating them here would only make this repo red for someone else's commit.
      npm run build
      cd -

      # THE CREDENTIAL IS A SECRET MOUNT AND NEVER A BUILD ARG — an arg is recorded in the image
      # history, and this image is pullable. The launcher injects the run's commissioned idp client
      # as $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; these two flags hand that
      # pair to the mounts on the Dockerfile's mvnw RUN, which is the only place it exists.
      # Unconditional on purpose: a missing env source is NOT an error — measured on buildx v0.36.1,
      # `--secret id=x,env=DOES_NOT_EXIST` builds green and the mounted variable is simply unset —
      # so these lines do nothing at all until a run carries the pair.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-artifacts:$QITS_CI_SHA"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --build-arg QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_CENTRAL_MIRROR_URL:-}" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.

