# TEST-ONLY. The lib ships no datasource, so the suite supplies one: in-memory H2 on the DEFAULT
# datasource and the default persistence unit, which picks up every indexed entity.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:blobstore;DB_CLOSE_DELAY=-1

# The schema comes from the entities, not from Flyway: a lib carries no migrations, and generating
# the DDL from the mappings is what proves they are complete without a migration chain to copy.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Blob bytes under target/ (the test base class wipes this + the tables before each test).
qits.artifacts.blobs-dir=target/blobstore-test-blobs
