# Defaults this library jar ships (ordinal 100 — a jar's application.properties is ignored). The
# consuming service or its environment overrides any of them.
#
# NO DATASOURCE, NO PERSISTENCE UNIT AND NO FLYWAY KEYS. The module this came from shipped all
# three, which forced every consumer onto one named datasource and one migration lineage. A lib owns
# neither: the service that owns the tables names its datasource, assigns
# eu.wohlben.qits.artifacts.entity to a persistence unit and carries the migrations.

# Blob content lives on disk (content-addressed, fan-out dirs), decoupled from the metadata rows. A
# deployment names an absolute path on its volume.
qits.artifacts.blobs-dir=${user.home}/.qits/data/artifacts/blobs

# How long a blob file must sit untouched before a sweep may unlink it. The window belongs to the
# store rather than to any collector: it closes the race where a client's blob-exists probe answers
# "have it" for a blob about to go, and the manifest referencing it lands after.
qits.artifacts.gc.blob-grace-period=P7D
